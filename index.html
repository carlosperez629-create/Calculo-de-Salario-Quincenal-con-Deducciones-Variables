<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sueldo Quincenal</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <main class="contenedor">
        <h1>Cálculo de Sueldo Quincenal</h1>

        <form action="php/calcular.php" method="post">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="cedula">Cédula</label>
            <input type="text" id="cedula" name="cedula" required>

            <label for="diurna">Horas diurnas (675 Bs./h)</label>
            <input type="number" id="diurna" name="diurna" min="0" step="0.5" required>

            <label for="vespertina">Horas vespertinas (700 Bs./h)</label>
            <input type="number" id="vespertina" name="vespertina" min="0" step="0.5" required>

            <label for="nocturna">Horas nocturnas (956.23 Bs./h)</label>
            <input type="number" id="nocturna" name="nocturna" min="0" step="0.5" required>

            <button type="submit">Calcular</button>
        </form>
    </main>
</body>
</html>
